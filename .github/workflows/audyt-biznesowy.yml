name: Audyt wyliczen biznesowych (PR)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pobierz kod PR
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Zainstaluj zaleznosci (bez przegladarki)
        working-directory: scraper
        run: npm install --no-audit --no-fund
      - name: Testy modulow i regresji
        working-directory: scraper
        run: |
          node smoke.mjs
          node trefresh.mjs
          node tstabilnosc.mjs
          node tliczby.mjs
      - name: Sprawdz skladnie JavaScript na stronie
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import vm from 'node:vm';
          const html = readFileSync('index.html','utf8');
          const js = html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if (!js) throw new Error('Brak skryptu interfejsu');
          new vm.Script(js, { filename:'index.html' });
          console.log('OK: składnia interfejsu');
          NODE
