name: Audyt wyliczen biznesowych (PR)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pobierz kod PR
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Zainstaluj zaleznosci (bez przegladarki)
        working-directory: scraper
        run: npm install --no-audit --no-fund
      - name: Testy modulow i regresji
        working-directory: scraper
        run: |
          node smoke.mjs
          node trefresh.mjs
          node tstabilnosc.mjs
          node tliczby.mjs
          node thistoria.mjs
          node tjakosc-historii.mjs
          node tcenzurowanie.mjs
          node raport-historyczny.mjs ../historia-kart.json > /tmp/raport-historyczny-test.json
      - name: Uruchom izolowany przebieg fast bez publikacji
        env:
          FUT_DATA: ${{ runner.temp }}/data.json
        run: |
          cp data.json "$RUNNER_TEMP/data.json"
          cp historia.json "$RUNNER_TEMP/historia.json"
          cp historia-kart.json "$RUNNER_TEMP/historia-kart.json"
          CHROME="$(command -v google-chrome || true)"
          test -n "$CHROME" || { echo "Brak systemowego Chrome"; exit 1; }
          cd scraper
          FUT_CHROMIUM="$CHROME" node scrape.mjs fast
          node validate.mjs "$FUT_DATA"
          test -s "$RUNNER_TEMP/historia-kart.json" || { echo "Brak probek historii kart"; exit 1; }
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const d = JSON.parse(readFileSync(process.env.FUT_DATA,'utf8'));
          if (d.awaria) throw new Error(JSON.stringify(d.awaria));
          const path = process.env.FUT_DATA.replace(/[^/]+$/, "historia-kart.json");
          const h = JSON.parse(readFileSync(path,"utf8"));
          if (h.wersja !== 2 || !h.migawki?.ps?.length || !h.migawki?.pc?.length || !Object.keys(h.ps||{}).length || !Object.keys(h.pc||{}).length)
            throw new Error("Archiwum nie zebralo cen obu platform");
          console.log("Historia kart: " + Object.keys(h.ps).length + " PS, " + Object.keys(h.pc).length + " PC");
          if (d.okazje?.poziomy?.ps && !Object.values(d.okazje.poziomy.ps).some(x=>x.v===3)) throw new Error('Brak modelu EMA v3');
          if (!d.tier?.cards?.ps || !d.tier?.cards?.pc) throw new Error('Brak rynku PC lub konsoli');
          console.log('OK: obie platformy i EMA v3, bez zapisu na main');
          NODE
      - name: Sprawdz raport historii na izolowanym pobraniu
        working-directory: scraper
        run: |
          node raport-historyczny.mjs "$RUNNER_TEMP/historia-kart.json" > /tmp/raport-historyczny-po-odczycie.json
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const r=JSON.parse(readFileSync("/tmp/raport-historyczny-po-odczycie.json","utf8"));
          if(r.audyt.platformy.ps.kart===0||r.audyt.platformy.pc.kart===0)
            throw new Error("Brak kart w raporcie");
          for(const side of ["ps","pc"]){
            for(const h of ["7200","43200"]){
              const x=r.backtest.wyniki[side][h];
              if(x.poczatki!==x.oczekujace+x.brakKolejnegoNotowania+x.wynikiZaobserwowane)
                throw new Error("Brak rozliczenia kohorty: "+side+" "+h);
            }
          }
          if(r.cenzurowanie.platformy.ps.obserwowanePrzejscia<0) throw new Error("Zle liczniki migawek");
          console.log("Raport jakości ma spójne liczniki dla PC/PS");
          NODE
      - name: Sprawdz skladnie JavaScript na stronie
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import vm from 'node:vm';
          const html = readFileSync('index.html','utf8');
          const js = html.match(/<script>([\s\S]*?)<\/script>/)?.[1];
          if (!js) throw new Error('Brak skryptu interfejsu');
          new vm.Script(js, { filename:'index.html' });
          console.log('OK: składnia interfejsu');
          NODE
