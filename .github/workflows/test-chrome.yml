name: Test Chrome bez instalacji i publikacji

# Bezpieczny eksperyment: nie uruchamia się automatycznie i nie zapisuje danych na main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instaluj tylko pakiety NPM (bez Chromium)
        working-directory: scraper
        run: npm install --no-audit --no-fund

      - name: Sprawdz systemowego Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome nie istnieje na tej maszynie - nic nie zmieniam w produkcji."
            exit 1
          fi
          "$CHROME" --version
          echo "FUT_CHROMIUM=$CHROME" >> "$GITHUB_ENV"
          echo "Chrome: $CHROME"

      - name: Przygotuj izolowana kopie danych
        shell: bash
        run: |
          set -euo pipefail
          cp data.json "$RUNNER_TEMP/data.json"
          cp historia.json "$RUNNER_TEMP/historia.json"
          echo "FUT_DATA=$RUNNER_TEMP/data.json" >> "$GITHUB_ENV"
          echo "Produkcyjne dane nie beda modyfikowane."

      - name: Uruchom przegladarke bez instalacji
        working-directory: scraper
        run: |
          node --input-type=module <<'NODE'
          import { open } from './lib/browser.mjs';
          const { browser, page } = await open();
          try {
            console.log('Chrome uruchomiony:', browser.version());
            await page.goto('about:blank');
            if (await page.evaluate(() => document.readyState) !== 'complete') {
              throw new Error('Niepoprawny stan przegladarki');
            }
            console.log('OK: Playwright steruje systemowym Chrome.');
          } finally {
            await browser.close();
          }
          NODE

      - name: Zmierz prawdziwy odczyt fast i zweryfikuj rynki
        working-directory: scraper
        shell: bash
        run: |
          set -euo pipefail
          START=$(date +%s)
          node scrape.mjs fast
          END=$(date +%s)
          echo "CZAS_FAST_SEK=$((END-START))"
          node validate.mjs "$FUT_DATA"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const d = JSON.parse(readFileSync(process.env.FUT_DATA, 'utf8'));
          for (const p of ['ps', 'pc']) {
            const pasma = d.tier?.cards?.[p];
            if (!pasma || Object.keys(pasma).length < 5) {
              throw new Error(`Brak potwierdzonych pasm rynku ${p}`);
            }
            console.log(`OK: ${p}: pasm=${Object.keys(pasma).length}, snajpy=${d.snipe?.[p]?.rows?.length ?? 0}`);
          }
          if (d.awaria) throw new Error(`Scraper zgłosił awarie: ${JSON.stringify(d.awaria)}`);
          console.log(`ODCZYT_FAST=${new Date(d.atFast * 1000).toISOString()}`);
          console.log('OK: test izolowany; bez push i bez publikacji strony.');
          NODE
