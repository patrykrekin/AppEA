name: Badanie historycznej ceny kart (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: appea-historia-analiza
  cancel-in-progress: true

jobs:
  analiza:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sprawdz historie i warunkowy wynik modeli
        run: |
          node scraper/tjakosc-historii.mjs
          node scraper/tcenzurowanie.mjs
          node scraper/raport-historyczny.mjs historia-kart.json > raport-jakosci.json
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from "node:fs";
          const r=JSON.parse(readFileSync("raport-jakosci.json","utf8"));
          let lines=[
            "# AppEA · jakość archiwum indywidualnych cen",
            "",
            "Archiwum: " + new Date(r.archiwumAt*1000).toISOString(),
            "",
            "| Rynek | Karty | Punkty | Świeże < 20 min | Gotowe 12 h | Oznaczone anomalie |",
            "|---|---:|---:|---:|---:|---:|"
          ];
          for(const p of ["ps","pc"]){
            const q=r.audyt.platformy[p];
            lines.push("| "+p+" | "+q.kart+" | "+q.probek+" | "+q.swiezych20min+
              " | "+q.gotowych12h+" | "+q.odstajacych+" |");
          }
          lines.push("","## Nieobecnosc w limitowanej liscie (tylko od migawek v2)","",
            "| Rynek | Pary migawek | Przejscia kart | Zniknelo z listy | Udzial % | Gorna polowa % | Dolna polowa % |",
            "|---|---:|---:|---:|---:|---:|---:|");
          for(const p of ["ps","pc"]){
            const q=r.cenzurowanie.platformy[p],f=x=>x===null?"—":x;
            lines.push("| "+p+" | "+q.paryMigawek+" | "+q.obserwowanePrzejscia+
              " | "+q.zniknelyZListy+" | "+f(q.udzialZnikajacychPct)+
              " | "+f(q.zniknieciaWGornejPolowie.udzialPct)+
              " | "+f(q.zniknieciaWDolnejPolowie.udzialPct)+" |");
          }
          lines.push("","Nieobecnosc w ograniczonej liscie NIE dowodzi sprzedazy, braku karty na rynku ani przyszlej ceny.");
          lines.push("","## Ocena modeli po 2 h i 12 h","",
            "| Rynek | Horyzont | Oceniane początki | Rozstrzygnięte | Niewidoczne | Czekające | Błąd ostatniej | Błąd EMA | Błąd mediany | Błąd hybrydy |",
            "|---|---|---:|---:|---:|---:|---:|---:|---:|---:|");
          for(const p of ["ps","pc"])for(const h of [7200,43200]){
            const q=r.backtest.wyniki[p][h], f=x=>x===null?"—":x+"%";
            lines.push("| "+p+" | "+h/3600+" h | "+q.poczatki+" | "+q.wynikiZaobserwowane+
              " | "+q.brakKolejnegoNotowania+" | "+q.oczekujace+
              " | "+f(q.bladPct.ostatnia)+" | "+f(q.bladPct.ema12)+
              " | "+f(q.bladPct.mediana12)+" | "+f(q.bladPct.hybryda)+" |");
          }
          lines.push("","Wszystkie błędy są warunkowe na PONOWNEJ obserwacji karty w najtańszych ofertach; brak notowania nie jest stratą ani zyskiem.",
            "Nie wdrażamy zwycięzcy bez dojrzałych danych, reprezentatywności i późniejszego holdoutu.",
            "");
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n"));
          NODE
      - name: Zachowaj raport jako artefakt na 30 dni
        uses: actions/upload-artifact@v4
        with:
          name: badanie-historii
          path: raport-jakosci.json
          retention-days: 30
