name: Etap 8 - rzeczywisty shadow fast (jednorazowy, izolowany)
on:
  push:
    branches:
      - research/shadow-predecision-20261107
    paths:
      - '.github/workflows/shadow-stage8-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-real-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout branch research (NOT main)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preflight syntax and test schema
        working-directory: scraper
        run: |
          node --check scrape.mjs
          node --check lib/shadow-probe-stage8.mjs
          node --check sprawdz-shadow-etap8.mjs
          node tshadow-decyzje.mjs
      - name: Copy last committed main data into runner.temp (never into repo)
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          echo "Baseline main SHA:"
          git rev-parse FETCH_HEAD
          git show FETCH_HEAD:data.json > "$RUNNER_TEMP/data.json"
          git show FETCH_HEAD:historia.json > "$RUNNER_TEMP/historia.json"
          git show FETCH_HEAD:historia-kart.json > "$RUNNER_TEMP/historia-kart.json"
          echo "Probe branch SHA:"
          git rev-parse HEAD
          test -s "$RUNNER_TEMP/data.json"
      - name: Install existing scraper dependencies
        working-directory: scraper
        run: npm install --no-audit --no-fund
      - name: Single isolated real fast cycle — no production publication
        shell: bash
        env:
          FUT_DATA: ${{ runner.temp }}/data.json
          FUT_SHADOW_AUDIT_PATH: ${{ runner.temp }}/shadow-stage8.json
        run: |
          CHROME="$(command -v google-chrome || true)"
          test -n "$CHROME" || { echo "Chrome not found"; exit 1; }
          export FUT_CHROMIUM="$CHROME"
          export FUT_SHADOW_COMMIT_SHA="$(git rev-parse HEAD)"
          cd scraper
          node scrape.mjs fast
          test -s "$FUT_SHADOW_AUDIT_PATH"
          node validate.mjs "$FUT_DATA"
          node sprawdz-shadow-etap8.mjs "$FUT_SHADOW_AUDIT_PATH" "$FUT_DATA" "$RUNNER_TEMP/shadow-etap8-summary.json"
      - name: Artifact only — short retention
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etap8-izolowana-migawka-decyzji
          path: |
            ${{ runner.temp }}/shadow-stage8.json
            ${{ runner.temp }}/shadow-etap8-summary.json
          retention-days: 3
          if-no-files-found: warn
