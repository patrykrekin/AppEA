name: Research shadow decisions — offline only
on:
  push:
    branches:
      - research/shadow-predecision-20261107
    paths:
      - 'scraper/lib/shadow-decyzje.mjs'
      - 'scraper/tshadow-decyzje.mjs'
      - '.github/workflows/shadow-stage7-ci.yml'

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parse and test without browser or network access to FUT.GG
        working-directory: scraper
        run: |
          node --check lib/shadow-decyzje.mjs
          node --check tshadow-decyzje.mjs
          node tshadow-decyzje.mjs
