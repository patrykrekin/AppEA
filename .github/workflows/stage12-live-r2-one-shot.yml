name: Stage12 LIVE R2 — one authorized synthetic CAS pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage12-live-r2-one-shot.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN_STAGE12_R2 to authorize a new live test using synthetic data'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: appea-stage12-live-r2-pilot
  cancel-in-progress: false

jobs:
  writer:
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[stage12-authorized-live-once]'))
      || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_STAGE12_R2')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: r2-stage12-pilot
    steps:
      - name: Checkout frozen, research-only test script
        uses: actions/checkout@v4
        with:
          ref: 03226d8f8e84360ec924f83168eb1fee1d5c63c1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install S3 client locally in runner
        run: npm install --no-save --no-audit --no-fund --no-package-lock @aws-sdk/client-s3
      - name: Live R2 CAS writer — only synthetic run-specific object
        run: node research/stage12/live-r2-manual.mjs writer
        env:
          APPEA_STAGE12_LIVE_CONSENT: 'yes'
          R2_PILOT_ID: stage12-${{ github.run_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
  reader:
    needs: writer
    if: needs.writer.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: r2-stage12-pilot
    steps:
      - name: Checkout same frozen test script on independent runner
        uses: actions/checkout@v4
        with:
          ref: 03226d8f8e84360ec924f83168eb1fee1d5c63c1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install S3 client locally in runner
        run: npm install --no-save --no-audit --no-fund --no-package-lock @aws-sdk/client-s3
      - name: Live R2 independent reader and simulated lost ACK — synthetic only
        run: node research/stage12/live-r2-manual.mjs reader
        env:
          APPEA_STAGE12_LIVE_CONSENT: 'yes'
          R2_PILOT_ID: stage12-${{ github.run_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
