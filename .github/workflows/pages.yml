name: Publikacja strony

# Klasyczne budowanie Pages z gałęzi ma miękki limit 10 buildów na godzinę, więc
# przy commicie z cenami co kilka minut wchodziliśmy prosto w sufit. Dokumentacja
# GitHuba mówi wprost, że ten limit NIE obowiązuje, gdy stronę publikuje własny
# workflow — i właśnie to robi ten plik.
#
# UWAGA: sam plik nie wystarczy. W repo trzeba przestawić
#   Settings → Pages → Build and deployment → Source → GitHub Actions
# inaczej krok deploy-pages padnie, a stara publikacja z gałęzi zostanie.

# Commit z cenami robi bot Actions tokenem GITHUB_TOKEN, a GitHub celowo NIE odpala
# wtedy nic nowego: "if a workflow run pushes code using the repository's GITHUB_TOKEN,
# a new workflow will not run even when the repository contains a workflow configured
# to run when push events occur". Przy starej publikacji z gałęzi to nie przeszkadzało,
# bo build wstawał sam, z ramienia Pages. Teraz publikuje zwykły workflow, więc na
# samym "push" strona by zamarzła. Dlatego drugi wyzwalacz: kończy się cykl cen →
# publikujemy. "push" zostaje dla plików wgrywanych ręcznie.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Odświeżenie cen"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedna publikacja naraz. Przebiegi, które zdążyły się ustawić w kolejce za
# najnowszym, są pomijane — przy commicie co kilka minut to jest to, czego chcemy:
# liczy się ostatni stan cen, nie każdy po kolei.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Nieudany cykl cen nic nie zapisał, więc nie ma czego publikować.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publikujemy tylko to, co strona faktycznie podaje przeglądarce.
      # Katalog scraper/ nie ma po co trafiać do internetu.
      - name: Złóż stronę
        run: |
          mkdir -p _site
          cp index.html data.json _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
