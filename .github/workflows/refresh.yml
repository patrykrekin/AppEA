name: Odświeżenie cen

# Harmonogram wywołuje zewnętrzny cron przez workflow_dispatch.
# Aby wrócić do harmonogramu GitHuba, przywróć blok schedule.
on:
  workflow_dispatch:
    inputs:
      cycle:
        description: "auto = wybierz po przeterminowaniu"
        default: auto
        type: choice
        options: [auto, fast, slow]

# Push robi wbudowany GITHUB_TOKEN — żadnego własnego tokena, żadnego sekretu w repo.
permissions:
  contents: write

# 28.09.2026: jeden wspólny tor zakleszczył wszystko. Cykl top potrafi chodzić
# kilkanaście minut (50 kart × czekanie na dorenderowanie), a cron puka co 5 minut —
# każde kolejne pukanie lądowało w kolejce za nim i było anulowane. Skutek: ceny
# stanęły na dwie godziny, choć i cron, i Actions raportowały "normalnie".
# Osobny tor per cykl: długi top mieli sobie z boku, a fast leci dalej.
concurrency:
  group: refresh-${{ github.event.inputs.cycle || 'auto' }}
  cancel-in-progress: false      # dwa przebiegi tego samego cyklu nie mogą pisać naraz

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Który cykl
        id: c
        working-directory: scraper
        env:
          FUT_DATA: ${{ github.workspace }}/data.json
        run: |
          WYBOR="${{ github.event_name == 'workflow_dispatch' && inputs.cycle || 'auto' }}"
          if [ "$WYBOR" = "auto" ]; then
            WYBOR=$(node cykl.mjs)
            echo "auto → $WYBOR"
          else
            echo "ręcznie → $WYBOR"
          fi
          echo "cycle=$WYBOR" >> "$GITHUB_OUTPUT"

      - name: Zależności
        working-directory: scraper
        run: npm install --no-audit --no-fund

      # Chromium waży ~150 MB. Cache oszczędza minuty i ruch przy każdym przebiegu.
      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      # 30.09.2026: sześć przebiegów na 150 padło na wysyłce mimo udanego scrape'a.
      # To NIE był wyścig dwóch przebiegów — concurrency działa poprawnie, sprawdzone
      # na czasach faktycznego wykonania: ani jednej nakładki. Przyczyna jest inna:
      # zakolejkowany przebieg dostaje commit z chwili WYZWOLENIA, nie z chwili startu.
      # Gdy poprzedni przebieg zwolnił (30.09 rekord: 679 s zamiast typowych 70),
      # następny odczekiwał swoje w kolejce, startował ze starym SHA, robił checkout
      # nieaktualnego drzewa i przy wysyłce dostawał non-fast-forward.
      # Dowód: przebiegi #878 i #880 miały ten sam head_sha 25dd3ac, a #880 padł.
      # Dociągamy świeży main PRZED pracą — wtedy wysyłka jest zawsze fast-forward
      # i nie ma czego rebase'ować. --autostash, bo drzewo ma tu być czyste, ale
      # nie chcemy paść, gdyby jednak coś w nim siedziało.
      - name: Dociągnij świeży main
        run: git pull --rebase --autostash origin main
            # 04.10.2026: dwa razy w tygodniu przy wklejaniu bloku znikała deklaracja
      # stałej. Moduł wywalał się ReferenceError-em przy imporcie, czyli ZANIM
      # scrape.mjs wszedł w swój try — więc nie zapisywała się nawet `awaria`
      # i ceny stawały bez śladu. Walidator tego nie łapie, bo sprawdza gotowy
      # plik, a plik w ogóle nie powstawał.
      # Idzie PRZED Chromium: nie ma sensu ściągać 150 MB przeglądarki i mielić
      # dwóch rynków, żeby paść na literówce w deklaracji.
      - name: Dymny test modułów
        working-directory: scraper
        run: node smoke.mjs
      - name: Chromium
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Pobierz ceny
        working-directory: scraper
        env:
          FUT_DATA: ${{ github.workspace }}/data.json
        run: node scrape.mjs ${{ steps.c.outputs.cycle }}

      # Walidacja jest już w scrape.mjs i przy błędzie plik nie jest ruszany,
      # ale sprawdzamy jeszcze raz to, co faktycznie ląduje w repo.
      - name: Sprawdź plik
        working-directory: scraper
        run: node validate.mjs ${{ github.workspace }}/data.json

      # 28.09.2026: każde wgranie pliku wywalało przebieg na czerwono i gubiło odczyt.
      # Przyczyna: workflow robi checkout na starcie, mieli ~minutę, a potem pcha.
      # Jeżeli w tym czasie ktoś wypchnie cokolwiek na main (choćby okazje.mjs),
      # `git push` leci non-fast-forward i job pada — mimo że scrape zdążył policzyć.
      # Skutek był gorszy niż czerwona kropka: przepadał CAŁY odczyt, więc rwały się
      # serie trwałości i szeregi cen. Teraz przy odrzuceniu robimy rebase i próbujemy
      # ponownie. Prawdziwy konflikt na data.json (dwa przebiegi naraz) ma paść głośno,
      # a nie po cichu nadpisać cudzy pomiar. Po poprawce z 30.09 ta ścieżka jest już
      # tylko ostatnią linią obrony, nie codziennym zdarzeniem.
      # if: always() — bo od 30.09 nieudany scrape zapisuje do data.json powód awarii,
      # a bez tego krok byłby pominięty razem z resztą i powód nigdy by nie wyjechał
      # z runnera. Wysyłamy wtedy poprzedni, zwalidowany plik plus jeden klucz
      # „awaria". Sam scrape i tak zwraca kod błędu, więc przebieg zostaje czerwony.
      - name: Wyślij, jeśli się zmienił
        if: always()
        run: |
          git config user.name  "Terminal FUT"
          git config user.email "bot@terminal.fut"
          git add data.json
          if git diff --cached --quiet; then
            echo "Ceny bez zmian — nic nie wysyłam."
            exit 0
          fi
          git commit -q -m "ceny $(TZ=Europe/Warsaw date '+%d.%m %H:%M')"
          for i in 1 2 3; do
            if git push -q; then
              echo "Wysłane za $i. razem."
              exit 0
            fi
            echo "Push odrzucony — ktoś wypchnął na main w międzyczasie (próba $i/3)."
            if ! git pull --rebase -q; then
              echo "BŁĄD: konflikt na data.json przy rebase — nie nadpisuję cudzego odczytu."
              exit 1
            fi
            sleep 3
          done
          echo "BŁĄD: trzy próby wysyłki nieudane."
          exit 1
