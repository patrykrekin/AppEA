name: Odświeżenie cen

# Harmonogram wywołuje zewnętrzny cron przez workflow_dispatch.
# Aby wrócić do harmonogramu GitHuba, przywróć blok schedule.
on:
  workflow_dispatch:
    inputs:
      cycle:
        description: "auto = wybierz po przeterminowaniu"
        default: auto
        type: choice
        options: [auto, fast, slow]

# Push robi wbudowany GITHUB_TOKEN — żadnego własnego tokena, żadnego sekretu w repo.
permissions:
  contents: write

# Jeden strumień ZAPISU dla fast/slow/auto. Nie zabijaj uruchomionego scrape'a.
# GitHub trzyma co najwyżej jeden oczekujący workflow w grupie — starsze oczekujące
# są zastępowane najnowszym, a zapis nie jest wykonywany równolegle.
concurrency:
  group: appea-refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Pobierz stan najnowszej gałęzi PRZED wyborem cyklu auto.
      # W kolejce GitHub job może mieć starszy SHA niż obecny main.
      - name: Dociągnij świeży main
        run: git pull --rebase --autostash origin main

      - name: Który cykl
        id: c
        working-directory: scraper
        env:
          FUT_DATA: ${{ github.workspace }}/data.json
        run: |
          WYBOR="${{ github.event_name == 'workflow_dispatch' && inputs.cycle || 'auto' }}"
          if [ "$WYBOR" = "auto" ]; then
            WYBOR=$(node cykl.mjs)
            echo "auto → $WYBOR"
          else
            echo "ręcznie → $WYBOR"
          fi
          echo "cycle=$WYBOR" >> "$GITHUB_OUTPUT"

      - name: Zależności
        working-directory: scraper
        run: npm install --no-audit --no-fund

      - name: Dymny test modułów
        working-directory: scraper
        run: |
          node smoke.mjs
          node trefresh.mjs
          node tstabilnosc.mjs
      # Izolowany test 05.11.2026 potwierdził pełny scrape fast na tym Chrome:
      # 7 pasm PS i PC, 12 snajpów/rynek, walidacja OK, 26 s właściwego odczytu.
      # NIE instalujemy przeglądarki ani zależności apt przy każdym przebiegu.
      - name: Systemowy Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::Brak systemowego Google Chrome — odmawiam pracy na niezweryfikowanej przeglądarce."
            exit 1
          fi
          "$CHROME" --version
          echo "FUT_CHROMIUM=$CHROME" >> "$GITHUB_ENV"

      - name: Pobierz ceny
        working-directory: scraper
        env:
          FUT_DATA: ${{ github.workspace }}/data.json
        run: node scrape.mjs ${{ steps.c.outputs.cycle }}

      # Walidacja jest już w scrape.mjs i przy błędzie plik nie jest ruszany,
      # ale sprawdzamy jeszcze raz to, co faktycznie ląduje w repo.
      - name: Sprawdź plik
        working-directory: scraper
        run: node validate.mjs ${{ github.workspace }}/data.json

      # 28.09.2026: każde wgranie pliku wywalało przebieg na czerwono i gubiło odczyt.
      # Przyczyna: workflow robi checkout na starcie, mieli ~minutę, a potem pcha.
      # Jeżeli w tym czasie ktoś wypchnie cokolwiek na main (choćby okazje.mjs),
      # `git push` leci non-fast-forward i job pada — mimo że scrape zdążył policzyć.
      # Skutek był gorszy niż czerwona kropka: przepadał CAŁY odczyt, więc rwały się
      # serie trwałości i szeregi cen. Teraz przy odrzuceniu robimy rebase i próbujemy
      # ponownie. Prawdziwy konflikt na data.json (dwa przebiegi naraz) ma paść głośno,
      # a nie po cichu nadpisać cudzy pomiar. Po poprawce z 30.09 ta ścieżka jest już
      # tylko ostatnią linią obrony, nie codziennym zdarzeniem.
      # if: always() — bo od 30.09 nieudany scrape zapisuje do data.json powód awarii,
      # a bez tego krok byłby pominięty razem z resztą i powód nigdy by nie wyjechał
      # z runnera. Wysyłamy wtedy poprzedni, zwalidowany plik plus jeden klucz
      # „awaria". Sam scrape i tak zwraca kod błędu, więc przebieg zostaje czerwony.
      - name: Wyślij, jeśli się zmienił
        if: always()
        run: |
          git config user.name  "Terminal FUT"
          git config user.email "bot@terminal.fut"
          git add data.json historia.json historia-kart.json
          if git diff --cached --quiet; then
            echo "Ceny bez zmian — nic nie wysyłam."
            exit 0
          fi
          git commit -q -m "ceny $(TZ=Europe/Warsaw date '+%d.%m %H:%M')"
          for i in 1 2 3; do
            if git push -q; then
              echo "Wysłane za $i. razem."
              exit 0
            fi
            echo "Push odrzucony — ktoś wypchnął na main w międzyczasie (próba $i/3)."
            if ! git pull --rebase -q; then
              echo "BŁĄD: konflikt na data.json przy rebase — nie nadpisuję cudzego odczytu."
              exit 1
            fi
            sleep 3
          done
          echo "BŁĄD: trzy próby wysyłki nieudane."
          exit 1
