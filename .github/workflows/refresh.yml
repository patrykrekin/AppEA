name: Odświeżenie cen

# Cykl szybki i wolny odpalają ten sam job z innym argumentem.
# Wartości startowe — popraw po `node calibrate.mjs 180`.
# Jeden cron, dziwne minuty. GitHub opóźnia harmonogram przy obciążeniu, a najgorsze
# są pełne godziny — :00 i :30 to dokładnie te, w które celował poprzedni "*/30".
# Który cykl pójdzie, decyduje cykl.mjs po tym, co jest przeterminowane, a nie po tym,
# którego crona GitHub akurat dostarczył (27.09 dostarczył ten z 05:11 o 10:30).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      cycle:
        description: "auto = wybierz po przeterminowaniu"
        default: auto
        type: choice
        options: [auto, fast, slow, top]

# Push robi wbudowany GITHUB_TOKEN — żadnego własnego tokena, żadnego sekretu w repo.
permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false      # dwa cykle nie mogą pisać naraz

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Który cykl
        id: c
        working-directory: scraper
        env:
          FUT_DATA: ${{ github.workspace }}/data.json
        run: |
          WYBOR="${{ github.event_name == 'workflow_dispatch' && inputs.cycle || 'auto' }}"
          if [ "$WYBOR" = "auto" ]; then
            WYBOR=$(node cykl.mjs)
            echo "auto → $WYBOR"
          else
            echo "ręcznie → $WYBOR"
          fi
          echo "cycle=$WYBOR" >> "$GITHUB_OUTPUT"

      - name: Zależności
        working-directory: scraper
        run: npm install --no-audit --no-fund

      # Chromium waży ~150 MB. Cache oszczędza minuty i ruch przy każdym przebiegu.
      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Chromium
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Pobierz ceny
        working-directory: scraper
        env:
          FUT_DATA: ${{ github.workspace }}/data.json
        run: node scrape.mjs ${{ steps.c.outputs.cycle }}

      # Walidacja jest już w scrape.mjs i przy błędzie plik nie jest ruszany,
      # ale sprawdzamy jeszcze raz to, co faktycznie ląduje w repo.
      - name: Sprawdź plik
        working-directory: scraper
        run: node validate.mjs ${{ github.workspace }}/data.json

      - name: Wyślij, jeśli się zmienił
        run: |
          git config user.name  "Terminal FUT"
          git config user.email "bot@terminal.fut"
          git add data.json
          if git diff --cached --quiet; then
            echo "Ceny bez zmian — nic nie wysyłam."
            exit 0
          fi
          git commit -q -m "ceny $(TZ=Europe/Warsaw date '+%d.%m %H:%M')"
          git push
