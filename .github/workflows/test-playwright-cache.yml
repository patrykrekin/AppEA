name: Test Playwright Chromium bez apt

# Porównanie z odizolowanym testem Chrome: bez zapisu do repo i publikacji.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-playwright-cache
  cancel-in-progress: false

jobs:
  porownanie:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pakiety NPM
        working-directory: scraper
        run: npm install --no-audit --no-fund

      - name: Odtworz cache Playwright
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      # Tu testujemy TYLKO usunięcie --with-deps. Nie uruchamiamy apt.
      - name: Zweryfikuj binarium bez instalacji apt
        working-directory: scraper
        shell: bash
        run: |
          set -euo pipefail
          START=$(date +%s)
          npx playwright install chromium
          END=$(date +%s)
          echo "CZAS_PRZYGOTOWANIA_CHROMIUM_SEK=$((END-START))"

      - name: Przygotuj izolowane pliki
        shell: bash
        run: |
          set -euo pipefail
          cp data.json "$RUNNER_TEMP/data.json"
          cp historia.json "$RUNNER_TEMP/historia.json"
          echo "FUT_DATA=$RUNNER_TEMP/data.json" >> "$GITHUB_ENV"

      - name: Odczytaj oba rynki i wykonaj walidacje
        shell: bash
        working-directory: scraper
        run: |
          set -euo pipefail
          START=$(date +%s)
          node scrape.mjs fast
          END=$(date +%s)
          echo "CZAS_FAST_SEK=$((END-START))"
          node validate.mjs "$FUT_DATA"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const d = JSON.parse(readFileSync(process.env.FUT_DATA, 'utf8'));
          for (const p of ['ps', 'pc']) {
            const pasma = d.tier?.cards?.[p];
            if (!pasma || Object.keys(pasma).length < 5) {
              throw new Error(`Brak pasm ${p}`);
            }
            console.log(`OK: ${p}: pasm=${Object.keys(pasma).length}, snajpy=${d.snipe?.[p]?.rows?.length ?? 0}`);
          }
          if (d.awaria) throw new Error(JSON.stringify(d.awaria));
          console.log(`ODCZYT_FAST=${new Date(d.atFast * 1000).toISOString()}`);
          console.log('OK: bez zmiany danych produkcyjnych.');
          NODE
