name: Kontrola odświeżania

# Niezależna od zewnętrznego crona kopia bezpieczeństwa. Odpala się tylko,
# gdy zegar fast (>12 minut) lub slow (>12 godzin w oknie slow) jest spóźniony.
# GitHub schedule może się opóźniać: to jest ratunek, nie precyzyjny cron.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: watchdog-refresh
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sprawdź aktualność strumieni
        id: stan
        env:
          FUT_DATA: ${{ github.workspace }}/data.json
        run: |
          CYKL=$(node scraper/watchdog.mjs)
          echo "cycle=$CYKL" >> "$GITHUB_OUTPUT"
          echo "Potrzebny cykl: $CYKL"
      - name: Nie uruchamiaj dubla, jeśli scraper jest aktywny
        id: aktywne
        if: steps.stan.outputs.cycle != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNNING=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/refresh.yml/runs?status=in_progress&per_page=1" --jq '.total_count')
          QUEUED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/refresh.yml/runs?status=queued&per_page=1" --jq '.total_count')
          if [ "$RUNNING" -gt 0 ] || [ "$QUEUED" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Jest już trwający lub zakolejkowany scraper: nic nie uruchamiam."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Uruchom brakujący cykl
        if: steps.stan.outputs.cycle != 'skip' && steps.aktywne.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh.yml --ref main -f cycle="${{ steps.stan.outputs.cycle }}"
