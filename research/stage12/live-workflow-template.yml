# TEMPLATE ONLY. Not an active workflow.
# Must be deliberately copied to .github/workflows/ on main after user approval,
# private R2 bucket, scoped secrets, and environment approval setup.
name: Stage12 MANUAL LIVE R2 CAS pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage12-live-r2-pilot
  cancel-in-progress: false
jobs:
  writer:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: r2-stage12-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/stage12-node24-s3-contract-20261107
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-audit --no-fund --no-package-lock @aws-sdk/client-s3
      - run: node research/stage12/live-r2-manual.mjs writer
        env:
          APPEA_STAGE12_LIVE_CONSENT: 'yes'
          R2_PILOT_ID: stage12-${{ github.run_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
  reader:
    needs: writer
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: r2-stage12-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/stage12-node24-s3-contract-20261107
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-audit --no-fund --no-package-lock @aws-sdk/client-s3
      - run: node research/stage12/live-r2-manual.mjs reader
        env:
          APPEA_STAGE12_LIVE_CONSENT: 'yes'
          R2_PILOT_ID: stage12-${{ github.run_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
